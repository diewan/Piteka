[workspace]
members = [
    ".",
    "crates/piteka-domain",
    "crates/piteka-application",
    "crates/piteka-infra",
    "crates/piteka-parwana",
    "crates/piteka-storage",
    "crates/piteka-auth",
    "crates/piteka-ports",
    "crates/piteka-github",
    "crates/piteka-ui",
    "crates/piteka-tuppira",
    "apps/piteka-api",
    "apps/piteka-mcp",
    "apps/piteka-worker",
    "apps/piteka-web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
piteka-domain = { path = "crates/piteka-domain" }
piteka-application = { path = "crates/piteka-application" }
piteka-infra = { path = "crates/piteka-infra" }
piteka-parwana = { path = "crates/piteka-parwana" }
piteka-storage = { path = "crates/piteka-storage" }
piteka-auth = { path = "crates/piteka-auth" }
piteka-ports = { path = "crates/piteka-ports" }
piteka-github = { path = "crates/piteka-github" }
piteka-ui = { path = "crates/piteka-ui" }
piteka-tuppira = { path = "crates/piteka-tuppira" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }

[package]
name = "piteka"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum.workspace = true
piteka-application.workspace = true
piteka-infra.workspace = true
piteka-github.workspace = true
piteka-ports.workspace = true
piteka-storage = { workspace = true, features = ["postgres"] }
piteka-domain.workspace = true
piteka-parwana.workspace = true
piteka-api = { path = "apps/piteka-api" }
piteka-mcp = { path = "apps/piteka-mcp" }
tokio.workspace = true
async-trait.workspace = true
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"

[dev-dependencies]
piteka-domain.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
